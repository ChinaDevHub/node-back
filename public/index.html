<!DOCTYPE html>
        <html lang="az">
        <head>
            <meta charset="UTF-8">
            <title>Docker Backend</title>
            <style>
                body {
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    background-color: #0f172a;
                    color: #f8fafc;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 100vh;
                    margin: 0;
                }
                .card {
                    background-color: #1e293b;
                    padding: 40px;
                    border-radius: 16px;
                    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
                    text-align: center;
                    max-width: 400px;
                }
                h1 { color: #38bdf8; margin-top: 0; }
                p { color: #94a3b8; font-size: 15px; }
                .badge {
                    display: inline-block;
                    background-color: #22c55e;
                    color: white;
                    padding: 6px 14px;
                    border-radius: 20px;
                    font-size: 14px;
                    font-weight: bold;
                    margin-top: 15px;
                }
            </style>
        </head>
        <body>
            <div class="card">
                <h1>Docker İşləyir! 🚀</h1>
                <p>Bu səhifə birbaşa Docker konteynerinin içindəki Node.js serverindən gəlir.</p>
                <div class="badge">Status: Aktiv (Port 4000)</div>
            </div>
        </body>
        </html>
